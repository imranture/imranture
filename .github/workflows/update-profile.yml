name: Update profile art

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - .github/workflows/**

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVGs
        run: python3 scripts/generate.py
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user scope)
          # to include private contributions in the stats.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "chore: refresh profile art" && git push)
